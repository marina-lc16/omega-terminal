<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TERMINAL OMEGA // PROJECTE ORIGEN</title>
<style>
  body {
    background-color: #0d0d0d;
    color: #00ff66;
    font-family: 'Courier New', Courier, monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    box-sizing: border-box;
  }
  .terminal {
    background-color: #141414;
    border: 2px solid #00ff66;
    border-radius: 8px;
    padding: 30px;
    max-width: 500px;
    width: 100%;
    box-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
  }
  h1 {
    font-size: 1.3rem;
    text-align: center;
    border-bottom: 1px solid #00ff66;
    padding-bottom: 10px;
    margin-top: 0;
    letter-spacing: 2px;
  }
  p {
    font-size: 0.95rem;
    line-height: 1.5;
    color: #00cc52;
  }
  .input-group {
    margin: 25px 0;
    text-align: center;
  }
  input[type="text"] {
    background-color: #050505;
    border: 1px solid #00ff66;
    color: #00ff66;
    font-family: 'Courier New', Courier, monospace;
    font-size: 1.4rem;
    padding: 10px;
    width: 180px;
    text-align: center;
    letter-spacing: 4px;
    outline: none;
  }
  button {
    background-color: #00ff66;
    color: #050505;
    border: none;
    font-family: 'Courier New', Courier, monospace;
    font-weight: bold;
    font-size: 1rem;
    padding: 12px 24px;
    margin-top: 15px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  button:hover {
    background-color: #00cc52;
  }
  #result {
    margin-top: 25px;
    padding: 15px;
    border: 1px dashed #00ff66;
    display: none;
    background-color: #081a0e;
  }
  .success {
    color: #00ff66;
  }
  .error {
    color: #ff3333;
    border-color: #ff3333 !important;
  }
</style>
</head>
<body>

<div class="terminal">
  <h1>[ TERMINAL OMEGA ]</h1>
  <p>SISTEMA REQUEREIX VERIFICACIÓ TEMPORAL PER DESBLOQUEJAR ELS REGALS I EL SOBRE 03.</p>
  <p><strong>Fórmula:</strong><br>(Dia Origen + Dia Llegat + Dia Connexió) × Mes Origen</p>
  
  <div class="input-group">
    <input type="text" id="code" maxlength="4" placeholder="0000">
    <br>
    <button onclick="verifyCode()">ACTIVAR PROTOCOL</button>
  </div>

  <div id="result"></div>
</div>

<script>
function verifyCode() {
  const input = document.getElementById('code').value.trim();
  const res = document.getElementById('result');
  
  if (input === '0790' || input === '790') {
    res.style.display = 'block';
    res.className = 'success';
    res.innerHTML = "ACCES AUTORITZAT<br><br>" +
                    "UBICACIO DE L'ULTIMA MISSIO:<br>" +
                    "Al pis d'entremig.<br><br>" +
                    "Finalitza la missio per completar la linia temporal.";
  } else {
    res.style.display = 'block';
    res.className = 'error';
    res.innerHTML = "CODI INCORRECTE<br>Revisa les dates registrades al Dossier.";
  }
}
</script>

</body>
</html>
